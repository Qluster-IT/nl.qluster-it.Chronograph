<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../../assets/css/fontawesome.min.css">
	<link rel="stylesheet" href="../../assets/css/solid.min.css">
	<link rel="stylesheet" href="../../assets/css/regular.min.css">
	<link rel="stylesheet" href="../../assets/css/brands.min.css">
	<link rel="stylesheet" href="../../assets/css/chronograph-widget.css">
	<link rel="stylesheet" href="../../assets/css/multiple-chronographs-widget.css">
</head>
<body class="homey-widget" ng-controller="MultipleChronographsController">
	<main class="multiple-chronographs">
		<p class="chronograph-error" role="alert" ng-if="error">{{ error }}</p>
		<p class="chronograph-message" ng-if="!entries.length && !error">{{ emptyMessage }}</p>
		<div class="multiple-chronographs-rows" ng-attr-data-separator="{{ rowSeparator }}"
			ng-attr-style="--multiple-separator-color: {{ rowSeparatorColor }}">
			<div class="multiple-chronographs-grid" ng-repeat="row in rows track by $index"
				ng-style="{ 'grid-template-columns': 'repeat(' + columns + ', minmax(0, 1fr))' }">
			<article ng-repeat="widgetEntry in row track by widgetEntry.slot"
				ng-controller="ChronographWidgetController"
				ng-style="{ 'grid-column': 'span ' + widgetEntry.span }"
				class="chronograph-widget homey-text-regular"
				ng-class="{ 'chronograph-vivid': runningColor !== 'none' || inactiveColor !== 'none',
					'chronograph-layout-normal': layout === 'normal', 'chronograph-layout-large': layout === 'large',
					'chronograph-layout-compact': layout === 'compact' }">
				<ng-include ng-if="selectedChronograph && designEnabled" src="'../../assets/templates/chronograph-widget-design.html'"></ng-include>
				<section class="chronograph-tile" ng-if="selectedChronograph && !designEnabled" ng-class="{
					'chronograph-tile-running': selectedChronograph.active && selectedChronograph.running,
					'chronograph-tile-paused': selectedChronograph.active && !selectedChronograph.running,
					'chronograph-tile-starting': layout === 'compact' && showStartForm
				}">
					<div class="chronograph-row">
						<div class="chronograph-summary">
							<h2 class="chronograph-name" ng-style="schemeElementStyle('name')"><i class="chronograph-icon" ng-if="iconClass" ng-class="iconClass" ng-attr-data-button-color="{{ iconColor }}" ng-style="schemeElementStyle('icon')" aria-hidden="true"></i><img class="chronograph-icon" ng-if="iconImage && !iconMask" ng-src="{{ iconImage }}" alt="" aria-hidden="true"><span class="chronograph-icon chronograph-icon-mask" ng-if="iconMask" ng-attr-data-button-color="{{ iconColor }}" ng-style="{ '-webkit-mask-image': iconMask, 'mask-image': iconMask }" aria-hidden="true"></span>{{ getDisplayName(selectedChronograph) }}</h2>
							<p class="chronograph-status" ng-style="schemeElementStyle('status')">{{ selectedChronograph.active ? (selectedChronograph.running ? labels.running : labels.paused) : labels.notRunning }}</p>
						</div>
						<p class="chronograph-duration" aria-live="polite" ng-if="selectedChronograph.active" ng-style="schemeElementStyle('duration')">{{ formatDuration(selectedChronograph) }}</p>
					</div>
					<button class="chronograph-start-button chronograph-compact-start" type="button" ng-if="layout === 'compact' && !selectedChronograph.active && !showStartForm" ng-click="beginStart()" ng-disabled="busy" ng-attr-data-button-color="{{ playColor }}" ng-style="schemeElementStyle('play')" ng-attr-aria-label="{{ labels.start }}">
						<i class="fa-solid fa-play" aria-hidden="true"></i>
					</button>
					<div class="chronograph-actions" ng-if="selectedChronograph.active">
						<button class="chronograph-action" type="button" ng-click="toggle()" ng-disabled="busy"
							ng-attr-data-button-color="{{ selectedChronograph.running ? pauseColor : playColor }}"
							ng-style="schemeElementStyle(selectedChronograph.running ? 'pause' : 'play')" ng-attr-aria-label="{{ selectedChronograph.running ? labels.pause : labels.resume }}">
							<i class="fa-solid" ng-class="selectedChronograph.running ? 'fa-pause' : 'fa-play'" aria-hidden="true"></i>
						</button>
						<button class="chronograph-action" type="button" ng-click="stop()" ng-disabled="busy" ng-attr-data-button-color="{{ stopColor }}" ng-style="schemeElementStyle('stop')" ng-attr-aria-label="{{ labels.stop }}">
							<i class="fa-solid fa-stop" aria-hidden="true"></i>
						</button>
					</div>
					<form class="chronograph-start-form" ng-class="{ 'chronograph-transition-start-form': isTransition }" ng-if="!selectedChronograph.active && (layout !== 'compact' || showStartForm)" ng-submit="start()">
						<div class="chronograph-fields" ng-if="!isStopwatch">
							<div class="chronograph-duration-fields">
								<label class="visually-hidden" ng-attr-for="{{ widgetInputPrefix + 'duration' }}">{{ labels.duration }}</label>
								<input class="form-control" ng-attr-id="{{ widgetInputPrefix + 'duration' }}" type="number" min="1" step="any" ng-model="startValues.time" required>
								<label class="visually-hidden" ng-attr-for="{{ widgetInputPrefix + 'unit' }}">{{ labels.unit }}</label>
								<select class="form-select" ng-attr-id="{{ widgetInputPrefix + 'unit' }}" ng-model="startValues.unit" ng-options="unit.id as unit.label for unit in units"></select>
							</div>
							<div class="chronograph-transition-fields" ng-if="isTransition">
								<div><label class="visually-hidden" ng-attr-for="{{ widgetInputPrefix + 'from' }}">{{ labels.from }}</label>
								<input class="form-control" ng-attr-id="{{ widgetInputPrefix + 'from' }}" type="number" step="any" placeholder="{{ labels.from }}" ng-model="startValues.from" required></div>
								<div><label class="visually-hidden" ng-attr-for="{{ widgetInputPrefix + 'to' }}">{{ labels.to }}</label>
								<input class="form-control" ng-attr-id="{{ widgetInputPrefix + 'to' }}" type="number" step="any" placeholder="{{ labels.to }}" ng-model="startValues.to" required></div>
								<div><label class="visually-hidden" ng-attr-for="{{ widgetInputPrefix + 'steps' }}">{{ labels.steps }}</label>
								<input class="form-control" ng-attr-id="{{ widgetInputPrefix + 'steps' }}" type="number" min="2" step="1" placeholder="{{ labels.steps }}" ng-model="startValues.steps" required></div>
							</div>
						</div>
						<button class="chronograph-start-button" type="submit" ng-disabled="busy" ng-attr-data-button-color="{{ playColor }}" ng-style="schemeElementStyle('start')"><i class="fa-solid fa-play" aria-hidden="true"></i> {{ labels.start }}</button>
						<button class="chronograph-cancel-button" type="button" ng-if="layout === 'compact' && !isStopwatch" ng-click="cancelStart()" ng-disabled="busy" ng-attr-data-button-color="{{ designButtonColor('cancel') }}" ng-style="schemeElementStyle('cancel')" ng-attr-aria-label="{{ labels.cancel }}"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
					</form>
				</section>
				<p class="chronograph-error" role="alert" ng-if="error">{{ error }}</p>
			</article>
			</div>
		</div>
	</main>
	<script src="../../assets/js/angular.min.js"></script>
	<script src="../../assets/js/chronograph-widget-style.js"></script>
	<script src="../../assets/js/chronograph-errors.js"></script>
	<script src="../../assets/js/chronograph-widget.js"></script>
	<script src="../../assets/js/multiple-chronographs-widget.js"></script>
</body>
</html>
